name: agrodoc

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    networks: [agrodoc]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-agrodoc_db}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-agrodoc_db}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../Backend
    restart: unless-stopped
    networks: [agrodoc]
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agrodoc_db}"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-me}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}"
      MODEL_PATH: "${MODEL_PATH:-/models/model.onnx}"
      CONFIDENCE_THRESHOLD: "${CONFIDENCE_THRESHOLD:-0.70}"
    volumes:
      - ../ml/export:/models:ro
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build: ../Frontend
    restart: unless-stopped
    networks: [agrodoc]
    ports: ["3000:80"]
    depends_on: [api]

networks:
  agrodoc:

volumes:
  pgdata:
