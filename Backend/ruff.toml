target-version = "py312"
line-length = 100

extend-exclude = ["alembic/versions"]

[lint]
extend-select = ["I", "UP", "B"]
# Migraciones autogeneradas por Alembic: son snapshots históricos, no se lintan.

[lint.flake8-bugbear]
# FastAPI inyecta dependencias con `Depends(...)` en los defaults: es el patrón
# oficial de FastAPI, no un bug (B008).
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "fastapi.File"]

[lint.isort]
known-first-party = ["app"]
# El directorio local `alembic/` no debe confundirse con el paquete instalado.
known-third-party = ["alembic"]
